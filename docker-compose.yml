x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.1
    container_name: sad_traefik
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DOCKER_API_VERSION=1.41
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=serial.ar@gmail.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

  mysql:
    image: mysql:8.0
    logging: *default-logging
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Admin123!}
      - MYSQL_DATABASE=SADInscripciones
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./docker/mysql/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-Admin123!}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    logging: *default-logging
    expose:
      - "5161"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5161
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=SADInscripciones;User=root;Password=${MYSQL_ROOT_PASSWORD:-Admin123!};
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-SAD-Inscripciones-SuperSecretKey-2024-MinLength32Chars!}
      - MercadoPago__FrontendBaseUrl=https://www.diabetes2.org.ar
      - SyncSettings__ApiKey=${SYNC_API_KEY:-sad-sync-secret-key-2026}
      - Email__EncryptionKey=${EMAIL_ENCRYPTION_KEY}
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend
      dockerfile: ../docker/nginx/Dockerfile
    logging: *default-logging
    expose:
      - "80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`www.diabetes2.org.ar`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  mysql_dev_data:
  traefik_letsencrypt:
