services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Admin123!}
      - MYSQL_DATABASE=SADInscripciones
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./docker/mysql/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-Admin123!}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "5161"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5161
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=SADInscripciones;User=root;Password=${MYSQL_ROOT_PASSWORD:-Admin123!};
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-SAD-Inscripciones-SuperSecretKey-2024-MinLength32Chars!}
      - MercadoPago__AccessToken=${MP_ACCESS_TOKEN:-CHANGE_ME}
      - MercadoPago__FrontendBaseUrl=https://waspy-clarissa-elatedly.ngrok-free.dev
      - SyncSettings__ApiKey=${SYNC_API_KEY:-sad-sync-secret-key-2026}
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend
      dockerfile: ../docker/nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    command: start --all --config /etc/ngrok.yml
    depends_on:
      - nginx

volumes:
  mysql_dev_data:
