x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ngrok:
    image: ngrok/ngrok:latest
    container_name: sad_ngrok
    restart: unless-stopped
    logging: *default-logging
    command: start --all --config /etc/ngrok.yml
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - "4040:4040"
    depends_on:
      - nginx

  mysql:
    image: mysql:8.0
    logging: *default-logging
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Admin123!}
      - MYSQL_DATABASE=SADInscripciones
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./docker/mysql/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-Admin123!}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    logging: *default-logging
    expose:
      - "5161"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5161
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=SADInscripciones;User=root;Password=${MYSQL_ROOT_PASSWORD:-Admin123!};
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-SAD-Inscripciones-SuperSecretKey-2024-MinLength32Chars!}
      - MercadoPago__FrontendBaseUrl=https://${DOMAIN}
      - SyncSettings__ApiKey=${SYNC_API_KEY:-sad-sync-secret-key-2026}
      - Email__EncryptionKey=${EMAIL_ENCRYPTION_KEY}
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend
      dockerfile: ../docker/nginx/Dockerfile
    logging: *default-logging
    expose:
      - "80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  mysql_dev_data:
